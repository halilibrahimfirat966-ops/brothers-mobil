# Android APK'yı GitHub sunucularında derler. Bilgisayara Flutter kurmak gerekmez.
# Çalıştırma: GitHub'da depo > Actions > "Android APK" > Run workflow
# Bitince sayfanın altındaki "brothers-teknoloji-apk" dosyasını indirin.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Proje kurulumu (Android dosyaları, izinler, simge)
        shell: pwsh
        run: ./kurulum.ps1

      - name: APK derle
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: brothers-teknoloji-apk
          path: build/app/outputs/flutter-apk/app-release.apk
